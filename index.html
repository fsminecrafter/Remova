<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wifi-keyboard</title>
<style>
:root{--bg:#f6f6f4;--fg:#1c1c1a;--mut:#80807a;--line:#dcdcd6;--acc:#2f6fed;--ok:#2e9e5b;--bad:#d04b4b}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121213;--fg:#e6e6e3;--mut:#7d7d78;--line:#2a2a2c;--acc:#6b9bff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121213;--fg:#e6e6e3;--mut:#7d7d78;--line:#2a2a2c;--acc:#6b9bff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
header b{font-weight:600;margin-right:auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.dot.on{background:var(--ok)}
button,input{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:7px 14px}
button{cursor:pointer}
button:hover{border-color:var(--mut)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
#login{margin:auto;display:flex;flex-direction:column;gap:12px;width:min(320px,86vw)}
#login p{margin:0;color:var(--mut);min-height:1.5em}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
#views{display:flex;gap:8px;padding:12px 18px 0}
#views button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
#keyboardView{flex:1;display:flex;flex-direction:column;min-height:0}
#pad{flex:1;margin:18px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);padding:20px;touch-action:none;user-select:none}
#pad.locked{border-style:solid;border-color:var(--acc);color:var(--acc)}
#bar{display:flex;gap:10px;padding:0 18px 18px}
#bar .grow{flex:1}
#bar .primary{border-color:var(--acc);color:var(--acc)}
#filesView{flex:1;display:flex;flex-direction:column;gap:10px;padding:14px 18px 18px;min-height:0}
.file-toolbar{display:flex;align-items:center;gap:8px}
.file-toolbar #filePath,.file-toolbar #fileSearch{flex:1;min-width:0}
#filePath{background:color-mix(in srgb,var(--fg) 4%,transparent)}
button:disabled{opacity:.45;cursor:default}
#fileList{flex:1;min-height:100px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.file-row{display:grid;grid-template-columns:minmax(100px,1fr) auto;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.file-row:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.file-row.selected{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.file-name{border:0;text-align:left;padding:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-name.dir{color:var(--acc)}
.file-meta{color:var(--mut);font-size:12px;white-space:nowrap}
.file-empty{padding:28px 8px;text-align:center;color:var(--mut);font-size:13px}
#fileStatus{min-height:1.5em;color:var(--mut);font-size:13px}
#ctxMenu{position:fixed;z-index:5;min-width:180px;max-width:90vw;display:flex;flex-direction:column;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
#ctxMenu button{border:0;text-align:left;padding:8px 12px;white-space:nowrap}
#ctxMenu button:hover:not(:disabled),#ctxMenu button:focus-visible{background:color-mix(in srgb,var(--acc) 14%,transparent)}
#ctxMenu button.danger{color:var(--bad)}
#ctxMenu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
#fileEditor{position:fixed;inset:0;background:var(--bg);z-index:2;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
#editorTop,#editorBottom{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
#editorTop strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto}
#editorBottom{border:0;border-top:1px solid var(--line);justify-content:flex-end}
#editorText{flex:1;resize:none;width:100%;min-height:0;border:0;border-radius:0;background:transparent;color:var(--fg);font:14px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:16px 0;tab-size:4}
#editorText:focus{outline:none}
#sink{position:fixed;opacity:0;width:1px;height:1px;left:0;top:0}
@media(max-width:560px){header{padding:10px 12px}#filesView{padding:10px 12px 14px}.file-row{gap:4px}.file-meta{font-size:11px}.file-toolbar{gap:5px}.file-toolbar button{padding:6px 10px}}
</style>
</head>
<body>
<header>
  <b>wifi-keyboard</b>
  <span class="dot" id="dot"></span>
  <button id="theme" aria-label="Toggle theme">theme</button>
  <button id="out" class="hide">log out</button>
</header>

<div id="login" class="hide">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
  <button id="go">Unlock</button>
  <p id="err"></p>
</div>

<div id="app" class="hide">
  <nav id="views" aria-label="Views">
    <button id="showKeyboard" aria-pressed="true">Keyboard</button>
    <button id="showFiles" aria-pressed="false">Files</button>
  </nav>
  <div id="keyboardView">
    <div id="pad">Type anywhere. Everything goes to tty1.<br>Use Focus mouse to control the pointer.</div>
    <div id="bar">
      <button id="focus" class="primary grow">Focus mouse</button>
      <button id="kb">Keyboard</button>
    </div>
  </div>
  <section id="filesView" class="hide" aria-label="File explorer">
    <div class="file-toolbar">
      <button id="fileUp" title="Go to parent folder" aria-label="Go to parent folder">Up</button>
      <input id="filePath" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Current folder (type a path and press Enter)" placeholder="Type a path, press Enter">
      <button id="fileGo">Go</button>
      <button id="fileMenu" aria-haspopup="menu" title="Folder actions">Menu</button>
    </div>
    <div class="file-toolbar">
      <input id="fileSearch" type="search" placeholder="Search files" aria-label="Search files">
      <input id="filePicker" type="file" multiple class="hide">
    </div>
    <div id="fileStatus" role="status"></div>
    <div id="fileList" role="list"></div>
    <div id="ctxMenu" class="hide" role="menu"></div>
    <section id="fileEditor" class="hide" aria-label="File editor">
      <div id="editorTop"><strong id="editorPath"></strong><button id="closeEditor" aria-label="Close editor">Close</button></div>
      <textarea id="editorText" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="File contents"></textarea>
      <div id="editorBottom"><span id="editorStatus"></span><button id="saveFile" class="primary">Save</button></div>
    </section>
  </section>
</div>
<textarea id="sink" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>

<script>
const $ = id => document.getElementById(id);
const root = document.documentElement;
let ws, hadCode = false, locked = false;

// theme: follows system, toggle overrides
const saved = (() => { try { return localStorage.getItem("theme"); } catch { return null; } })();
if (saved) root.dataset.theme = saved;
$("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme:dark)").matches;
  const cur = root.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
};

// auth
async function show() {
  const ok = (await (await fetch("/api/me")).json()).ok;
  $("login").classList.toggle("hide", ok);
  $("app").classList.toggle("hide", !ok);
  $("out").classList.toggle("hide", !ok);
  if (ok) connect(); else $("pw").focus();
}
async function login() {
  const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({password: $("pw").value})});
  const j = await r.json();
  $("pw").value = "";
  if (j.ok) { $("err").textContent = ""; show(); } else $("err").textContent = j.error;
}
$("go").onclick = login;
$("pw").onkeydown = e => { if (e.key === "Enter") login(); };
$("out").onclick = async () => { ws && ws.close(); await fetch("/api/logout", {method: "POST"}); show(); };

// socket
function connect() {
  if (ws && ws.readyState <= 1) return;
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => $("dot").classList.add("on");
  ws.onclose = () => { $("dot").classList.remove("on"); setTimeout(() => !$("app").classList.contains("hide") && show(), 1500); };
}
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const active = () => !$("app").classList.contains("hide");
const keyboardActive = () => active() && !$("keyboardView").classList.contains("hide");

// file explorer
let filePathCurrent = "", fileRoot = "", selectedFile = null, searchTimer, listRequest = 0, searching = false;
let editorPathValue = "", editorDirty = false, clipboard = null, suppressClick = false;
const fileApi = async (url, options) => {
  const response = await fetch(url, options);
  const text = await response.text();
  let result = {};
  try { result = text ? JSON.parse(text) : {}; } catch {}  // plain-text errors (404/500) are not JSON
  if (response.status === 401) { show(); throw new Error("Logged out. Please unlock again."); }
  if (!response.ok) {
    const error = new Error(result.error || `Server error ${response.status}: ${text.slice(0, 120) || response.statusText}`);
    error.status = response.status;
    throw error;
  }
  return result;
};
const postJson = body => ({method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
const setFileStatus = message => { $("fileStatus").textContent = message; };
const parentOf = path => path.split("/").slice(0, -1).join("/");
const joinPath = (folder, name) => folder ? folder + "/" + name : name;
const rootBase = () => fileRoot.replace(/\/+$/, "");
function updatePathBar() {
  $("filePath").value = rootBase() + (filePathCurrent ? "/" + filePathCurrent : "") || "/";
  $("fileUp").disabled = !filePathCurrent;
}
function relFromTyped(value) {
  let v = value.trim().replace(/\\/g, "/");
  const base = rootBase();
  if (v === base || v.startsWith(base + "/")) v = v.slice(base.length);
  else if (v.startsWith("/")) throw new Error("Only paths inside " + (fileRoot || "the file area") + " are available.");
  return v.split("/").filter(part => part && part !== ".").join("/");
}
const setSelection = entry => {
  selectedFile = entry;
  document.querySelectorAll(".file-row").forEach(row => row.classList.toggle("selected", !!entry && row.dataset.path === entry.path));
};
const formatSize = size => size < 1024 ? size + " B" : size < 1048576 ? (size / 1024).toFixed(1) + " KB" : (size / 1048576).toFixed(1) + " MB";

function renderFiles(entries) {
  const list = $("fileList");
  list.replaceChildren();
  if (!entries.length) {
    const empty = document.createElement("div");
    empty.className = "file-empty";
    empty.textContent = searching ? "No matches." : "This folder is empty. Right-click (or long-press) here for New file, New folder and Upload.";
    list.append(empty);
    return;
  }
  entries.forEach(entry => {
    const row = document.createElement("div");
    row.className = "file-row";
    row.dataset.path = entry.path;
    row.entry = entry;
    row.setAttribute("role", "listitem");
    const name = document.createElement("button");
    name.className = "file-name" + (entry.directory ? " dir" : "");
    name.textContent = entry.name + (entry.directory ? "/" : "");
    name.title = searching ? entry.path : entry.name;
    name.onclick = () => {
      if (suppressClick) { suppressClick = false; return; }
      entry.directory ? loadFiles(entry.path) : openEditor(entry.path);
    };
    const meta = document.createElement("span");
    meta.className = "file-meta";
    meta.textContent = entry.directory ? "folder" : formatSize(entry.size);
    row.append(name, meta);
    list.append(row);
  });
}

// returns null on success, or the Error
async function loadFiles(path = filePathCurrent) {
  const request = ++listRequest;
  searching = false;
  setSelection(null);
  $("fileSearch").value = "";
  setFileStatus("Loading...");
  try {
    const data = await fileApi("/api/files?path=" + encodeURIComponent(path));
    if (request !== listRequest) return null;
    filePathCurrent = path;
    fileRoot = data.root || fileRoot;
    updatePathBar();
    renderFiles(data.entries);
    setFileStatus(data.entries.length + (data.entries.length === 1 ? " item" : " items"));
    return null;
  } catch (error) {
    if (request === listRequest) { setFileStatus(error.message); updatePathBar(); }
    return error;
  }
}
async function searchFiles(query) {
  const request = ++listRequest;
  setSelection(null);
  if (!query) { loadFiles(filePathCurrent); return; }
  setFileStatus("Searching...");
  try {
    const data = await fileApi("/api/files/search?q=" + encodeURIComponent(query));
    if (request !== listRequest) return;
    searching = true;
    renderFiles(data.entries);
    setFileStatus(data.entries.length + " result" + (data.entries.length === 1 ? "" : "s") + " in " + (rootBase() || "/"));
  } catch (error) { setFileStatus(error.message); }
}
async function goToTyped() {
  let rel;
  try { rel = relFromTyped($("filePath").value); } catch (error) { setFileStatus(error.message); updatePathBar(); return; }
  const error = await loadFiles(rel);
  if (!error || error.status !== 404 || !rel) return;
  const opened = await openEditor(rel, true);  // not a folder: maybe a file
  if (!opened) { if (parentOf(rel) !== filePathCurrent) loadFiles(parentOf(rel)); return; }
  setFileStatus(opened.status === 404 ? "Nothing found at that path." : opened.message);
}

// returns null on success, or the Error
async function openEditor(path, silent = false) {
  try {
    const data = await fileApi("/api/files/content?path=" + encodeURIComponent(path));
    editorPathValue = data.path;
    editorDirty = false;
    $("editorPath").textContent = (rootBase() + "/" + data.path) || data.path;
    $("editorText").value = data.content;
    $("editorStatus").textContent = "";
    $("fileEditor").classList.remove("hide");
    $("editorText").focus();
    return null;
  } catch (error) { if (!silent) setFileStatus(error.message); return error; }
}
async function saveEditor() {
  try {
    await fileApi("/api/files/content?path=" + encodeURIComponent(editorPathValue), {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({content: $("editorText").value})
    });
    editorDirty = false;
    $("editorStatus").textContent = "Saved";
    loadFiles(filePathCurrent);
  } catch (error) { $("editorStatus").textContent = error.message; }
}
async function runFileAction(action, path, values = {}) {
  try {
    await fileApi("/api/files/action", postJson({action, path, ...values}));
    setFileStatus("Done");
    if (searching) searchFiles($("fileSearch").value.trim()); else loadFiles(filePathCurrent);
    return true;
  } catch (error) { setFileStatus(error.message); return false; }
}

// actions (all reached from the context menu)
async function createItem(kind) {
  const name = prompt(kind === "mkdir" ? "New folder name" : "New file name");
  if (!name) return;
  if (await runFileAction(kind, filePathCurrent, {name}) && kind === "mkfile") openEditor(joinPath(filePathCurrent, name));
}
async function renameEntry(entry) {
  const name = prompt("Rename to", entry.name);
  if (name && name !== entry.name) runFileAction("rename", entry.path, {name});
}
function removeEntry(entry) {
  const what = entry.directory ? "folder " + entry.name + " and everything in it" : entry.name;
  if (confirm("Remove " + what + "?")) runFileAction("delete", entry.path);
}
function downloadEntry(entry) {
  const link = document.createElement("a");
  link.href = "/api/files/download?path=" + encodeURIComponent(entry.path);
  link.download = entry.name;
  document.body.append(link); link.click(); link.remove();
}
async function pasteInto(folder) {
  const item = clipboard;
  if (!item) return;
  if (await runFileAction(item.mode, item.entry.path, {destination: folder}) && item.mode === "move") clipboard = null;
}
const holdEntry = (mode, entry) => { clipboard = {mode, entry}; setFileStatus((mode === "copy" ? "Copied " : "Cut ") + entry.name + ". Right-click a folder or empty space and choose Paste."); };

function entryMenu(entry) {
  const items = entry.directory
    ? [{label: "Open", run: () => loadFiles(entry.path)}]
    : [{label: "Edit", run: () => openEditor(entry.path)}, {label: "Download", run: () => downloadEntry(entry)}];
  if (searching) items.push({label: "Show in folder", run: () => loadFiles(parentOf(entry.path))});
  items.push("-",
    {label: "Rename", run: () => renameEntry(entry)},
    {label: "Copy", run: () => holdEntry("copy", entry)},
    {label: "Cut (move)", run: () => holdEntry("move", entry)});
  if (entry.directory) items.push({label: "Paste into folder", disabled: !clipboard, run: () => pasteInto(entry.path)});
  items.push("-", {label: "Remove", danger: true, run: () => removeEntry(entry)});
  return items;
}
const folderMenu = () => [
  {label: "New file", run: () => createItem("mkfile")},
  {label: "New folder", run: () => createItem("mkdir")},
  {label: "Upload here", run: () => $("filePicker").click()},
  "-",
  {label: clipboard ? "Paste " + clipboard.entry.name : "Paste", disabled: !clipboard, run: () => pasteInto(filePathCurrent)},
  "-",
  {label: "Refresh", run: () => loadFiles(filePathCurrent)}
];

// context menu
const menu = $("ctxMenu");
const closeMenu = () => menu.classList.add("hide");
function openMenu(x, y, items) {
  menu.replaceChildren();
  items.forEach(item => {
    if (item === "-") { menu.append(document.createElement("hr")); return; }
    const button = document.createElement("button");
    button.textContent = item.label;
    button.disabled = !!item.disabled;
    button.setAttribute("role", "menuitem");
    if (item.danger) button.className = "danger";
    button.onclick = () => { closeMenu(); item.run(); };
    menu.append(button);
  });
  menu.classList.remove("hide");
  const box = menu.getBoundingClientRect();
  menu.style.left = Math.max(4, Math.min(x, innerWidth - box.width - 4)) + "px";
  menu.style.top = Math.max(4, Math.min(y, innerHeight - box.height - 4)) + "px";
  const first = menu.querySelector("button:not(:disabled)");
  if (first) first.focus();
}
function openContextAt(target, x, y) {
  const row = target.closest && target.closest(".file-row");
  if (row) { setSelection(row.entry); openMenu(x, y, entryMenu(row.entry)); }
  else { setSelection(null); openMenu(x, y, folderMenu()); }
}
$("filesView").addEventListener("contextmenu", event => {
  if (event.target.closest("input, textarea, #fileEditor, #ctxMenu")) return;  // keep native menu for text fields
  event.preventDefault();
  openContextAt(event.target, event.clientX, event.clientY);
});
$("fileMenu").onclick = event => {
  event.stopPropagation();
  const box = event.currentTarget.getBoundingClientRect();
  setSelection(null);
  openMenu(box.right - 190, box.bottom + 4, folderMenu());
};
document.addEventListener("pointerdown", event => { if (!menu.contains(event.target) && event.target.id !== "fileMenu") closeMenu(); });
addEventListener("keydown", event => {
  if (menu.classList.contains("hide")) return;
  if (event.key === "Escape") { closeMenu(); return; }
  if (event.key === "ArrowDown" || event.key === "ArrowUp") {
    event.preventDefault();
    const buttons = [...menu.querySelectorAll("button:not(:disabled)")];
    const at = buttons.indexOf(document.activeElement);
    buttons[(at + (event.key === "ArrowDown" ? 1 : -1) + buttons.length) % buttons.length].focus();
  }
});
addEventListener("resize", closeMenu);
addEventListener("blur", closeMenu);
$("fileList").addEventListener("scroll", closeMenu);

// touch long-press = right-click
let pressTimer = 0, pressX = 0, pressY = 0;
const cancelPress = () => { clearTimeout(pressTimer); pressTimer = 0; };
$("fileList").addEventListener("pointerdown", event => {
  if (event.pointerType === "mouse") return;
  pressX = event.clientX; pressY = event.clientY;
  const target = event.target;
  cancelPress();
  pressTimer = setTimeout(() => {
    pressTimer = 0;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 600);
    openContextAt(target, pressX, pressY);
  }, 500);
});
$("fileList").addEventListener("pointermove", event => { if (pressTimer && Math.hypot(event.clientX - pressX, event.clientY - pressY) > 10) cancelPress(); });
for (const type of ["pointerup", "pointercancel"]) $("fileList").addEventListener(type, cancelPress);

// view switching and toolbar
$("showKeyboard").onclick = () => {
  closeMenu();
  $("keyboardView").classList.remove("hide");
  $("filesView").classList.add("hide");
  $("showKeyboard").setAttribute("aria-pressed", "true");
  $("showFiles").setAttribute("aria-pressed", "false");
};
$("showFiles").onclick = () => {
  send({t: "r"});
  if (document.pointerLockElement) document.exitPointerLock();
  $("keyboardView").classList.add("hide");
  $("filesView").classList.remove("hide");
  $("showKeyboard").setAttribute("aria-pressed", "false");
  $("showFiles").setAttribute("aria-pressed", "true");
  loadFiles(filePathCurrent);
};
$("fileUp").onclick = () => loadFiles(parentOf(filePathCurrent));
$("fileGo").onclick = goToTyped;
$("filePath").onfocus = event => event.target.select();
$("filePath").onkeydown = event => {
  if (event.key === "Enter") { event.preventDefault(); goToTyped(); }
  else if (event.key === "Escape") { updatePathBar(); event.target.blur(); }
};
$("fileSearch").oninput = event => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => searchFiles(event.target.value.trim()), 180);
};
$("filePicker").onchange = async event => {
  const files = [...event.target.files];
  if (!files.length) return;
  const form = new FormData();
  form.append("path", filePathCurrent);
  files.forEach(file => form.append("files", file, file.name));
  setFileStatus("Uploading...");
  try {
    const data = await fileApi("/api/files/upload", {method: "POST", body: form});
    setFileStatus("Uploaded " + data.uploaded.length + " file" + (data.uploaded.length === 1 ? "" : "s"));
    loadFiles(filePathCurrent);
  } catch (error) { setFileStatus(error.message); }
  event.target.value = "";
};
$("editorText").oninput = () => { editorDirty = true; $("editorStatus").textContent = "Unsaved changes"; };
$("saveFile").onclick = saveEditor;
$("closeEditor").onclick = () => {
  if (editorDirty && !confirm("Discard unsaved changes?")) return;
  $("fileEditor").classList.add("hide");
};

// keyboard
addEventListener("keydown", e => {
  if (!keyboardActive() || e.isComposing) return;
  hadCode = !!e.code && e.code !== "Unidentified";
  if (!hadCode) return;
  if (e.code === "F5" || e.code === "F12" && e.ctrlKey) return;
  e.preventDefault();
  send({t: "k", c: e.code, d: 1});
});
addEventListener("keyup", e => {
  if (!keyboardActive() || !e.code) return;
  e.preventDefault();
  send({t: "k", c: e.code, d: 0});
});
addEventListener("blur", () => send({t: "r"}));

// phone soft keyboard (no key codes available)
$("kb").onclick = () => $("sink").focus();
$("sink").addEventListener("input", e => {
  if (hadCode) { e.target.value = ""; return; }
  if (e.inputType === "deleteContentBackward") { send({t: "k", c: "Backspace", d: 1}); send({t: "k", c: "Backspace", d: 0}); }
  else if (e.inputType === "insertLineBreak") { send({t: "s", s: "\n"}); }
  else if (e.data) send({t: "s", s: e.data});
  e.target.value = "";
});

// mouse: click "Focus mouse" to capture, Esc releases
const pad = $("pad");
$("focus").onclick = () => pad.requestPointerLock && pad.requestPointerLock();
document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === pad;
  pad.classList.toggle("locked", locked);
  pad.textContent = locked ? "Mouse focused. Press Esc to release." : "Type anywhere. Everything goes to tty1.\nUse Focus mouse to control the pointer.";
  $("focus").textContent = locked ? "Mouse focused" : "Focus mouse";
});
let dx = 0, dy = 0, raf = 0;
const flush = () => { raf = 0; if (dx || dy) send({t: "m", x: dx, y: dy}); dx = dy = 0; };
const move = (x, y) => { dx += Math.round(x); dy += Math.round(y); raf = raf || requestAnimationFrame(flush); };
document.addEventListener("mousemove", e => locked && move(e.movementX, e.movementY));
document.addEventListener("mousedown", e => locked && (e.preventDefault(), send({t: "b", b: e.button, d: 1})));
document.addEventListener("mouseup", e => locked && send({t: "b", b: e.button, d: 0}));
document.addEventListener("wheel", e => locked && (e.preventDefault(), send({t: "w", y: e.deltaY})), {passive: false});
document.addEventListener("contextmenu", e => locked && e.preventDefault());

// touch: drag to move, tap to click
let last, t0, moved;
pad.addEventListener("touchstart", e => { last = e.touches[0]; t0 = Date.now(); moved = 0; });
pad.addEventListener("touchmove", e => {
  const t = e.touches[0]; const x = (t.clientX - last.clientX) * 1.6, y = (t.clientY - last.clientY) * 1.6;
  moved += Math.abs(x) + Math.abs(y); last = t; move(x, y);
});
pad.addEventListener("touchend", () => {
  if (moved < 8 && Date.now() - t0 < 250) { send({t: "b", b: 0, d: 1}); send({t: "b", b: 0, d: 0}); }
});

show();
</script>
</body>
